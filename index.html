<style>
/* Layout: one phone-width column; sticky header stack (title, tabs, categories), fixed cart bar.
   Motifs: bento-shop order ticket (dashed stub, notches) and tea-cup thermal label. */
:root{
  --bg:#EDF1EA; --surface:#FFFFFF; --surface-2:#F4F7F2; --ink:#16231B; --muted:#5D6D63; --line:#D7DFD5;
  --leaf:#1E7A4C; --leaf-soft:#DDEFE3; --on-leaf:#FFFFFF;
  --yolk:#F2B431; --yolk-soft:#FCEFCB; --on-yolk:#2B2105;
  --chili:#CF4128; --chili-soft:#FBE3DD;
  --paper:#FFFDF5; --paper-ink:#2B2A26; --paper-line:#CDC5AE;
  --scrim:rgba(8,14,10,.45);
  --shadow:0 1px 2px rgba(22,35,27,.06),0 6px 18px rgba(22,35,27,.06);
  --a1:#1E7A4C; --a2:#C8742A; --a3:#3D6FB6; --a4:#B5476B; --a5:#6B5BB0; --a6:#2F8C8C;
  --f-display:"Huninn","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1612; --surface:#18221C; --surface-2:#131C17; --ink:#E5EDE7; --muted:#97A89D; --line:#2A3830;
    --leaf:#43B47C; --leaf-soft:#1C3527; --on-leaf:#06150D;
    --yolk:#F2C04E; --yolk-soft:#3A3016; --on-yolk:#2B2105;
    --chili:#FF7458; --chili-soft:#3D1F19;
    --paper:#1E2823; --paper-ink:#E9E4D4; --paper-line:#4A5A50;
    --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#18221C; --surface-2:#131C17; --ink:#E5EDE7; --muted:#97A89D; --line:#2A3830;
  --leaf:#43B47C; --leaf-soft:#1C3527; --on-leaf:#06150D;
  --yolk:#F2C04E; --yolk-soft:#3A3016; --on-yolk:#2B2105;
  --chili:#FF7458; --chili-soft:#3D1F19;
  --paper:#1E2823; --paper-ink:#E9E4D4; --paper-line:#4A5A50;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
/* iOS 輸入框字小於 16px 會自動放大畫面，所有輸入框都用 16px */
input,textarea,select{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
a{color:inherit;text-decoration:none}
input,textarea{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.spacer{flex:1}
svg{display:block;flex:none}

#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:12px 16px 10px;transition:box-shadow .2s}
.top.raised{box-shadow:0 1px 0 var(--line)}
.hrow{display:flex;align-items:center;gap:10px}
.hdate{font-size:13px;color:var(--muted);letter-spacing:.06em}
.hlogo{width:52px;height:52px;flex:none;margin-left:-4px}
.htitle{font-family:var(--f-display);font-weight:400;font-size:27px;line-height:1.2;margin:0;text-wrap:balance}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.meBtn{display:flex;align-items:center;gap:8px;height:40px;max-width:46%;padding:0 12px 0 4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:500;min-width:0}
.meBtn span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none;line-height:1}
.av.sm{width:24px;height:24px;font-size:11px}
.av.empty{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)}
.gh{min-width:0}
.gh-t{font-family:var(--f-display);font-size:20px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh-s{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}

.cd{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf);font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cd.urgent{background:var(--chili-soft);color:var(--chili)}
.cd.over{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-top:10px}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:500;color:var(--muted);font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg .n{font-size:12px;font-weight:700;color:var(--leaf)}

.cats{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;height:32px;padding:0 13px;border-radius:999px;font-size:14px;color:var(--muted);border:1px solid transparent}
.cat.on{background:var(--ink);color:var(--bg)}

/* home */
.demo{display:flex;align-items:center;gap:10px;background:var(--yolk-soft);border-radius:12px;padding:9px 12px;font-size:13px;margin-top:4px}
.demo b{font-weight:700}
.demo button{margin-left:auto;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px;flex:none}
.sect-h{display:flex;align-items:baseline;gap:8px;margin:22px 2px 10px}
.sect-h h2{font-family:var(--f-display);font-weight:400;font-size:18px;margin:0}
.sect-h span{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px}

.gcard{display:block;width:100%;text-align:left;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);position:relative;transition:transform .12s ease}
.gcard:active{transform:scale(.985)}
.gc-main{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:14px 14px 12px}
.glyph{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;font-family:var(--f-display);font-size:29px;line-height:1}
.glyph.bento{background:var(--leaf);color:var(--on-leaf)}
.glyph.drink{background:var(--yolk);color:var(--on-yolk)}
.gc-body{min-width:0;display:flex;flex-direction:column;gap:3px}
.gc-t{display:flex;align-items:center;gap:8px}
.gc-t b{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-m{font-size:13px;color:var(--muted)}
.gc-p{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13px;color:var(--muted)}
.avs{display:flex;padding-left:6px}
.avs .av{margin-left:-6px;border:2px solid var(--surface)}
.gc-stub{position:relative;border-top:1.5px dashed var(--line);padding:9px 14px 11px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.gc-stub::before,.gc-stub::after{content:"";position:absolute;top:-8px;width:14px;height:14px;border-radius:50%;background:var(--bg)}
.gc-stub::before{left:-7px}.gc-stub::after{right:-7px}
.gc-stub .mine{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc-stub .go{margin-left:auto;color:var(--leaf);font-weight:700;display:flex;align-items:center;gap:2px;flex:none}
.gcard.past{box-shadow:none;border:1px solid var(--line)}
.gcard.past .glyph{filter:saturate(.35);opacity:.8}

.empty-st{background:var(--surface);border-radius:var(--r);padding:28px 20px;text-align:center;border:1.5px dashed var(--line)}
.empty-st .glyph{margin:0 auto 10px}
.empty-st p{margin:4px 0 14px;color:var(--muted)}

.skel{height:118px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* menu */
.notice{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:12px}
.notice.closed{background:var(--chili-soft);border-color:transparent;color:var(--chili);font-weight:500}
.sec{scroll-margin-top:calc(var(--hdr,150px) + 6px);margin-top:18px}
.sec h3{font-family:var(--f-display);font-weight:400;font-size:17px;margin:0 2px 8px}
.menu{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.mrow{display:flex;align-items:center;gap:10px;padding:11px 12px 11px 14px;min-height:66px;transition:background .2s}
.mrow + .mrow{border-top:1px solid var(--line)}
.mrow.has{background:var(--leaf-soft)}
.mtap{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px;align-self:stretch;justify-content:center}
.mname{font-weight:500;font-size:16px;line-height:1.35}
.msub{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.price{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.pop{font-size:12px;color:var(--chili);background:var(--chili-soft);padding:0 6px;border-radius:6px;font-weight:500}
.mctl{display:flex;align-items:center;gap:8px;flex:none}
.add{width:38px;height:38px;border-radius:50%;background:var(--leaf);color:var(--on-leaf);display:grid;place-items:center;transition:transform .1s}
.add:active{transform:scale(.88)}
.add:disabled{background:var(--surface-2);color:var(--muted)}
.cnt{min-width:26px;height:26px;border-radius:13px;background:var(--yolk);color:var(--on-yolk);font-weight:700;font-size:13px;display:grid;place-items:center;padding:0 7px;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--leaf);border-radius:999px;padding:1px}
.stepper button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--leaf)}
.stepper button:active{background:var(--leaf-soft)}
.stepper .n{min-width:22px;text-align:center;font-weight:700;color:var(--leaf);font-variant-numeric:tabular-nums}
.stepper.big button{width:44px;height:44px}
.stepper.big .n{min-width:28px;font-size:17px}

/* thermal label + small tags */
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-block;padding:0 6px;border:1px solid var(--paper-line);background:var(--paper);color:var(--paper-ink);border-radius:4px;font-size:12px;line-height:1.6}
.tlabel{background:var(--paper);color:var(--paper-ink);border:1px dashed var(--paper-line);border-radius:8px;padding:10px 12px;margin-top:16px;font-variant-numeric:tabular-nums}
.tl-top{display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:.08em;opacity:.75}
.tl-item{font-family:var(--f-display);font-size:20px;margin-top:2px}
.tl-opts{font-size:14px;font-weight:500;min-height:21px}
.tl-opts.ph{opacity:.5;font-weight:400}
.tl-bot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px}
.bars{width:110px;height:20px;background:repeating-linear-gradient(90deg,var(--paper-ink) 0 2px,transparent 2px 4px,var(--paper-ink) 4px 5px,transparent 5px 8px,var(--paper-ink) 8px 11px,transparent 11px 12px);opacity:.75}
.tl-bot b{font-size:18px}

/* people */
.waiting{margin-top:14px;background:var(--surface);border-radius:var(--r);padding:12px 14px;border:1.5px dashed var(--line)}
.waiting-h{font-size:13.5px;font-weight:700;margin-bottom:8px}
.waiting-h span{color:var(--muted);font-weight:400}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 3px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px}
.pcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;margin-top:10px}
.pcard.me{outline:2px solid var(--leaf)}
.phead{display:flex;align-items:center;gap:10px}
.phead b{font-weight:700}
.phead small{color:var(--muted);font-size:12px}
.metag{font-size:11px;font-weight:700;color:var(--on-leaf);background:var(--leaf);padding:0 6px;border-radius:5px}
.plines{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.pline{display:flex;align-items:center;gap:10px}
.pl-main{flex:1;min-width:0}
.pl-name{font-weight:500}
.pl-note{font-size:12.5px;color:var(--muted)}
.follow{flex:none;height:32px;padding:0 12px 0 9px;border-radius:999px;border:1.5px solid var(--leaf);color:var(--leaf);font-weight:700;font-size:13px;display:flex;align-items:center;gap:3px}
.follow:active{background:var(--leaf-soft)}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.tile small{display:block;font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.tile b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.25;font-variant-numeric:tabular-nums}
.tile.due b{color:var(--chili)}
.tile.ok b{color:var(--leaf)}
.block{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
.block-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.block-h h3{margin:0;font-size:16px;font-weight:700}
.block-h small{color:var(--muted)}
.sbtn{height:34px;padding:0 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:5px;flex:none}
.sbtn.on{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf)}
.srow{display:flex;align-items:baseline;gap:10px;padding:9px 14px}
.srow + .srow{border-top:1px solid var(--line)}
.srow .nm{font-weight:700;flex:1;min-width:0}
.srow .q{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums}
.svars{padding:0 14px 8px;margin-top:-4px;display:flex;flex-direction:column;gap:3px}
.svar{display:flex;gap:8px;align-items:center;font-size:13.5px}
.svar .q{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.snote{font-size:12.5px;color:var(--muted);padding-left:2px}
.filters{display:flex;gap:6px;padding:10px 14px 0}
.fchip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prow{display:flex;align-items:center;gap:10px;padding:10px 14px}
.prow + .prow{border-top:1px solid var(--line)}
.prow .nm{flex:1;min-width:0;font-weight:500}
.prow .amt{font-weight:700;font-variant-numeric:tabular-nums}
.st{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.st.paid{background:var(--leaf-soft);color:var(--leaf)}
.st.unpaid{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.st.short,.st.over{background:var(--yolk-soft);color:var(--ink)}
.tog{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .18s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.tog.on{background:var(--leaf)}
.tog.on::after{transform:translateX(20px)}
.foot-note{font-size:12.5px;color:var(--muted);text-align:center;margin:16px 0 0}

/* cart bar */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.cartbtn{pointer-events:auto;max-width:528px;margin:0 auto;display:flex;align-items:center;gap:12px;width:100%;height:60px;border-radius:18px;background:var(--ink);color:var(--bg);padding:0 12px 0 10px;box-shadow:0 10px 30px rgba(0,0,0,.22);text-align:left;transition:transform .12s}
.cartbtn:active{transform:scale(.98)}
.cb-n{width:40px;height:40px;border-radius:12px;background:var(--yolk);color:var(--on-yolk);display:grid;place-items:center;font-weight:700;font-size:17px}
.cb-t{display:flex;flex-direction:column;line-height:1.25}
.cb-t small{font-size:12px;opacity:.75;display:flex;align-items:center;gap:4px}
.cb-amt{font-family:var(--f-display);font-size:22px}
.cartbtn.closed .cb-n{background:var(--muted);color:var(--bg)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:90%;background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.85,.25,1);z-index:50;display:flex;flex-direction:column;will-change:transform}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.grab{flex:none;height:22px;display:grid;place-items:center;touch-action:none}
.grab::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line)}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:0 18px calc(16px + env(safe-area-inset-bottom,0px))}
.sh-h{font-family:var(--f-display);font-weight:400;font-size:23px;line-height:1.3;margin:0;text-wrap:balance}
.sh-sub{font-size:13.5px;color:var(--muted);margin-top:2px}
.ogrp{margin-top:18px}
.ogrp-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:14.5px;margin-bottom:8px}
.req{font-size:12px;font-weight:500;color:var(--muted)}
.req.must{color:var(--chili)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:14.5px;display:inline-flex;align-items:center;gap:5px;transition:background .12s,border-color .12s}
.chip.on{border-color:var(--leaf);background:var(--leaf-soft);color:var(--leaf)}
.chip small{color:var(--muted);font-weight:400;font-size:12.5px}
.chip.on small{color:var(--leaf)}

    orders.push({ groupId: 'demo-tea', name, lines, total: sumAmt(lines), paid: 0, updatedAt: t - (10 - i) * 60e3 });
  });
  shuffled().slice(0, 12).forEach((name, i) => {
    const lines = [mkDrink()];
    orders.push({ groupId: 'demo-tea0', name, lines, total: sumAmt(lines), paid: i < 11 ? sumAmt(lines) : 0, updatedAt: t - 27 * 3600e3 });
  });
  return { seededAt: t, shops, menu, options, members, groups, orders };
}

const Mock = (() => {
  const KEY = 'jt_demo_v1';
  let mem = null;
  const load = () => {
    if (!mem) mem = store.get(KEY, null);
    if (!mem || now() - mem.seededAt > 6 * 3600e3) { mem = seedData(); persist(); }
    return mem;
  };
  const persist = () => store.set(KEY, mem);
  const need = p => { if (String(p.pin) !== PIN) throw apiErr('PIN', 'PIN 碼不對'); };
  const grp = (d, id) => { const g = d.groups.find(x => x.id === id); if (!g) throw apiErr('NOGROUP', '找不到這一團'); return g; };
  const H = {
    bootstrap(d) {
      const cutoff = now() - 3 * 864e5;
      const groups = d.groups.filter(g => g.deadline > cutoff);
      const ids = new Set(groups.map(g => g.id));
      return { shops: d.shops, menu: d.menu, options: d.options, members: d.members, groups, orders: d.orders.filter(o => ids.has(o.groupId)) };
    },
    saveOrder(d, p) {
      const g = grp(d, p.groupId);
      if (!(g.status === 'open' && now() < g.deadline)) throw apiErr('CLOSED', '這一團已截止');
      const name = String(p.name || '').trim(); if (!name) throw apiErr('NONAME', '請先填名字');
      const lines = cleanLines(p.lines);
      const o = d.orders.find(x => x.groupId === g.id && x.name === name);
      if (!lines.length) { d.orders = d.orders.filter(x => x !== o); return { ok: true }; }
      const row = o || { groupId: g.id, name, paid: 0 };
      if (!o) d.orders.push(row);
      Object.assign(row, { lines, total: sumAmt(lines), updatedAt: now() });
      return { ok: true };
    },
    setPaid(d, p) {
      need(p);
      const o = d.orders.find(x => x.groupId === p.groupId && x.name === p.name);
      if (!o) throw apiErr('NOORDER', '找不到這筆訂單');
      o.paid = p.paid ? o.total : 0; return { ok: true };
    },
    openGroup(d, p) {
      need(p);
      if (!d.shops.find(s => s.name === p.shop && !s.disabled)) throw apiErr('NOSHOP', '找不到這家店，或這家店暫停使用中');
      if (+p.deadline <= now()) throw apiErr('BADTIME', '截止時間已經過了');
      const g = { id: Math.random().toString(36).slice(2, 10), shop: p.shop, deadline: +p.deadline, status: 'open', note: String(p.note || '').slice(0, 80), createdAt: now() };
      d.groups.push(g); return { ok: true, id: g.id };
    },
    closeGroup(d, p) { need(p); grp(d, p.groupId).status = 'closed'; return { ok: true }; },
    deleteGroup(d, p) {
      need(p); grp(d, p.groupId);
      d.groups = d.groups.filter(g => g.id !== p.groupId); d.orders = d.orders.filter(o => o.groupId !== p.groupId);
      return { ok: true };
    },
    extendGroup(d, p) {
      need(p); const g = grp(d, p.groupId);
      g.status = 'open'; g.deadline = Math.max(now(), g.deadline) + (+p.minutes || 15) * 60e3; return { ok: true };
    },
    saveShop(d, p) {
      need(p);
      const s = p.shop || {}, name = String(s.name || '').trim().slice(0, 30), orig = p.orig || null;
      if (!name) throw apiErr('BAD', '請填店名');
      if (d.shops.some(x => x.name === name && x.name !== orig)) throw apiErr('DUP', '已經有「' + name + '」了');
      const type = s.type === '飲料' ? '飲料' : '便當', items = cleanItems(p.items, type);
      if (!items.length) throw apiErr('BAD', '菜單至少要有一個品項');
      const info = { name, type, phone: String(s.phone || '').slice(0, 30), note: String(s.note || '').slice(0, 60), disabled: !!s.disabled };
      if (orig) {
        const cur = d.shops.find(x => x.name === orig); if (!cur) throw apiErr('NOSHOP', '找不到「' + orig + '」');
        Object.assign(cur, info);
        d.groups.forEach(g => { if (g.shop === orig) g.shop = name; });
        d.options.forEach(o => { if (o.type === orig) o.type = name; });
      } else d.shops.push(info);
      d.menu = d.menu.filter(m => m.shop !== (orig || name)).concat(items.map(it => Object.assign({ shop: name }, it)));
      return { ok: true };
    },
    deleteShop(d, p) {
      need(p);
      if (d.groups.some(g => g.shop === p.name && g.status === 'open' && g.deadline > now())) throw apiErr('BUSY', '這家店還有進行中的團，先結單再刪除');
      d.shops = d.shops.filter(s => s.name !== p.name); d.menu = d.menu.filter(m => m.shop !== p.name);
      d.options = d.options.filter(o => o.type !== p.name);
      return { ok: true };
    },
    // type = 便當／飲料（共用選項）或店名（這家店的專屬選項；groups 空的就是改回共用）
    saveOptions(d, p) {
      need(p);
      const type = String(p.type || '');
      if (type !== '便當' && type !== '飲料' && !d.shops.some(s => s.name === type)) throw apiErr('NOSHOP', '找不到「' + type + '」');
      d.options = d.options.filter(o => o.type !== type).concat(cleanOptions(p.groups).flatMap(g => g.items.map(i => ({ type, group: g.name, label: i.label, add: i.add, multi: g.multi, required: g.required }))));
      return { ok: true };
    },
    saveMembers(d, p) { need(p); d.members = cleanMembers(p.members); return { ok: true }; },
  };
  return {
    async call(action, p = {}) {
      await sleep(action === 'bootstrap' ? 120 : 160 + Math.random() * 220);
      const d = load();
      if (!H[action]) throw apiErr('NOACTION', '未知的動作');
      const r = H[action](d, p); persist();
      return JSON.parse(JSON.stringify(r));
    },
    reset() { mem = seedData(); persist(); },
  };
})();

async function api(action, payload = {}) {
  if (DEMO) return Mock.call(action, payload);
  const res = action === 'bootstrap'
    ? await fetch(CONFIG.API_URL + '?action=bootstrap&t=' + now())
    : await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, payload)) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const j = await res.json();
  if (j.error) throw apiErr(j.code || 'ERR', j.error);
  return j;
}

  pending: {}, ver: {}, saveState: {}, timers: {},

const shopOf = g => S.data.shops.find(s => s.name === g.shop) || { name: g.shop, type: '便當', phone: '', note: '' };
const menuOf = name => S.data.menu.filter(m => m.shop === name);

const curGroup = () => S.data.groups.find(g => g.id === S.gid);

const myLines = gid => { const o = myOrder(gid); return o ? o.lines.map(l => Object.assign({}, l, { opts: (l.opts || []).slice() })) : []; };
// key = 店名（專屬選項）或 便當／飲料（共用選項）
function groupOpts(key) {
  const out = [];
  S.data.options.filter(o => o.type === key).forEach(o => {
    let g = out.find(x => x.name === o.group);
    if (!g) { g = { name: o.group, multi: o.multi, required: o.required, items: [] }; out.push(g); }
    g.items.push({ label: o.label, add: +o.add || 0 });
  });
  return out;
}
const hasOwnOpts = name => !!name && S.data.options.some(o => o.type === name);
const optionsFor = shop => hasOwnOpts(shop.name) ? groupOpts(shop.name) : groupOpts(shop.type);
const sizesOf = m => splitSizes(m.sizes);
const AV = ['--a1', '--a2', '--a3', '--a4', '--a5', '--a6'];
function avatar(name, cls = '') {
  if (!name) return `<span class="av empty ${cls}">?</span>`;
  let h = 0; for (const c of name) h = (h * 31 + c.codePointAt(0)) >>> 0;
  const chars = Array.from(name.trim());
  const ch = /[㐀-鿿]/.test(name) ? chars[chars.length - 1] : chars[0].toUpperCase();
  return `<span class="av ${cls}" style="background:var(${AV[h % AV.length]})">${esc(ch)}</span>`;
}
function cdText(ms) {
  const d = ms - now(); if (d <= 0) return '已截止';
  const m = Math.floor(d / 60e3), s = Math.floor(d / 1000) % 60;
  if (m >= 60) return '剩 ' + Math.floor(m / 60) + ' 小時 ' + (m % 60) + ' 分';
  return '剩 ' + pad(m) + ':' + pad(s);
}
function cdClass(g) { return g.status === 'closed' || g.deadline <= now() ? 'over' : (g.deadline - now() < 5 * 60e3 ? 'urgent' : ''); }
const cdHtml = g => `<span class="cd ${cdClass(g)}" data-cd="${g.deadline}" data-st="${g.status}">${g.status === 'closed' ? '已結單' : cdText(g.deadline)}</span>`;

/* ================= 資料同步 ================= */
function applyData(d, fromCache) {
  const next = {
    shops: d.shops || [], menu: d.menu || [], options: d.options || [], members: d.members || [], groups: d.groups || [],
    orders: (d.orders || []).map(o => Object.assign({}, o, { lines: Array.isArray(o.lines) ? o.lines : [] })),
  };
  // 我還沒存到伺服器的修改，保留手機上的版本
  Object.keys(S.pending).filter(g => S.pending[g]).forEach(gid => {
    next.orders = next.orders.filter(o => !(o.groupId === gid && o.name === S.me));
    const mine = S.data.orders.find(o => o.groupId === gid && o.name === S.me);
    if (mine) next.orders.push(mine);
  });
  const sig = JSON.stringify(next);
  if (!fromCache) store.set(CACHE_KEY, d);
  if (sig === S.sig) return;
  const first = !S.loaded;
  S.sig = sig; S.data = next; S.loaded = true; S.loadErr = null;
  first ? render() : softRender();
  if (first && !S.me && !S.sheet) askName();
}
async function refresh() {
  try { applyData(await api('bootstrap')); }
  catch (e) { if (!S.loaded) { S.loadErr = e; render(); } }
}
function setMine(gid, lines) {
  lines = lines.filter(l => l.qty > 0);
  let o = myOrder(gid);
  if (!lines.length) S.data.orders = S.data.orders.filter(x => x !== o);
  else {
    if (!o) { o = { groupId: gid, name: S.me, paid: 0, lines: [], total: 0 }; S.data.orders.push(o); }
    o.lines = lines; o.total = sumAmt(lines); o.updatedAt = now();
  }
  S.sig = ''; S.pending[gid] = true; S.ver[gid] = (S.ver[gid] || 0) + 1; S.saveState[gid] = 'saving';
  clearTimeout(S.timers[gid]); S.timers[gid] = setTimeout(() => flush(gid), 450);
  renderMain(); renderBar(); if (S.sheet === 'cart') openCart(true);
}
async function flush(gid) {
  clearTimeout(S.timers[gid]);
  const v = S.ver[gid];
  S.saveState[gid] = 'saving'; renderBar();
  try {
    await api('saveOrder', { groupId: gid, name: S.me, lines: myLines(gid) });
    if (S.ver[gid] === v) { S.pending[gid] = false; S.saveState[gid] = 'saved'; }
    renderBar(); if (S.sheet === 'cart') openCart(true);
  } catch (e) {
    if (e.code) {
      S.pending[gid] = false; S.saveState[gid] = e.code === 'CLOSED' ? 'closed' : 'saved';
      toast(e.code === 'CLOSED' ? '這一團已截止，剛才的修改沒有存到' : e.message);
      S.sig = ''; refresh();
    } else {
      S.saveState[gid] = 'error'; renderBar();
      S.timers[gid] = setTimeout(() => flush(gid), 3000);
    }
  }
}
function flushAll() { Object.keys(S.pending).filter(g => S.pending[g]).forEach(flush); }

function summarize(g) {
  const os = ordersOf(g.id), order = menuOf(g.shop).map(m => m.item);
  const items = new Map();
  os.forEach(o => o.lines.forEach(l => {
    let it = items.get(l.item);
    if (!it) { it = { item: l.item, qty: 0, vars: new Map() }; items.set(l.item, it); }
    it.qty += l.qty;
    const vk = variantText(l);
    let v = it.vars.get(vk);
    if (!v) { v = { label: vk, qty: 0, notes: [] }; it.vars.set(vk, v); }
    v.qty += l.qty; if (l.note) v.notes.push(o.name + '：' + l.note);
  }));
  const idx = n => { const i = order.indexOf(n); return i < 0 ? 999 : i; };
  const list = [...items.values()].sort((a, b) => idx(a.item) - idx(b.item)).map(it => Object.assign(it, { vars: [...it.vars.values()].sort((a, b) => b.qty - a.qty) }));
  const total = os.reduce((s, o) => s + o.total, 0), paid = os.reduce((s, o) => s + (+o.paid || 0), 0);
  const due = os.reduce((s, o) => s + Math.max(0, o.total - (+o.paid || 0)), 0);
  return { os, list, total, paid, due, qty: list.reduce((s, i) => s + i.qty, 0) };
}
function storeText(g) {
  const s = summarize(g), out = [`【${g.shop}】${fmtDate(g.deadline)} 共 ${s.qty} 份 ${money(s.total)}`];
  s.list.forEach(it => it.vars.forEach(v => {
    out.push(`${it.item}${v.label ? ' ' + v.label : ''} ×${v.qty}`);
    v.notes.forEach(n => out.push('　備註 ' + n));
  }));
  return out.join('\n');
}

function openSheet(name, html, opt = {}) {
  S.sheet = name; S.sheetOnClose = opt.onClose || null; S.sheetLocked = !!opt.locked;
  const body = $('#sheetBody');
  body.innerHTML = `<div class="sh">${html}</div>`;
  if (!opt.keepScroll) body.scrollTop = 0;
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); document.body.classList.add('lock');
  if (opt.mount) opt.mount(body.firstElementChild);
}
function closeSheet(force) {
  if (!S.sheet || (S.sheetLocked && !force)) return;
  const cb = S.sheetOnClose;
  S.sheet = null; S.sheetOnClose = null; S.sheetLocked = false;
  $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); document.body.classList.remove('lock');
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (cb) cb();
}

function needPin() {
  if (S.pinOk) return Promise.resolve(true);
  return new Promise(resolve => {
    let code = '';
    openSheet('pin', `
      <h2 class="sh-h" style="text-align:center">輸入管理碼</h2>
      <div class="sh-sub" style="text-align:center">開團、收款這類操作需要管理碼，避免誤觸</div>
      <div class="dots" id="pin-dots"><i></i><i></i><i></i><i></i></div>
      <div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k => `<button data-k="${k}">${k}</button>`).join('')}<button class="fn" data-k="c">清除</button><button data-k="0">0</button><button class="fn" data-k="b">刪除</button></div>`, {
      onClose: () => resolve(false),
      mount(root) {
        const dots = $('#pin-dots', root);
        const paint = () => $$('i', dots).forEach((d, i) => d.classList.toggle('on', i < code.length));
        root.addEventListener('click', e => {
          const k = e.target.closest('[data-k]'); if (!k) return;
          const v = k.dataset.k;
          if (v === 'c') code = ''; else if (v === 'b') code = code.slice(0, -1); else if (code.length < 4) code += v;
          paint();
          if (code.length === 4) {
            if (code === PIN) { S.pinOk = true; S.sheetOnClose = null; setTimeout(() => resolve(true), 120); }
            else { dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); setTimeout(() => { code = ''; paint(); }, 300); }
          }
        });
      },
    });
  });
}

function openItem(gid, itemName, editIdx) {
  const g = S.data.groups.find(x => x.id === gid); if (!g || !isOpen(g)) return;
  if (!S.me) return askName(() => openItem(gid, itemName, editIdx));
  const shop = shopOf(g), m = menuOf(g.shop).find(x => x.item === itemName); if (!m) return;
  const drink = shop.type === '飲料', groups = optionsFor(shop);
  const sz = sizesOf(m);
  const base = editIdx != null ? myLines(gid)[editIdx] : null;
  const st = { size: m.priceL ? (base && sz.includes(base.size) ? base.size : sz[0]) : '', qty: base ? base.qty : 1, sel: {} };
  groups.forEach(gr => { st.sel[gr.name] = new Set(); });
  if (base) base.opts.forEach(o => { const gr = groups.find(x => x.items.some(i => i.label === o)); if (gr) st.sel[gr.name].add(o); });
  const unit = () => (m.priceL && st.size === sz[1] ? m.priceL : m.price) + groups.reduce((s, gr) => s + gr.items.reduce((t, i) => t + (st.sel[gr.name].has(i.label) ? i.add : 0), 0), 0);
  const opts = () => groups.flatMap(gr => gr.items.filter(i => st.sel[gr.name].has(i.label)).map(i => i.label));
  const html = `
    <h2 class="sh-h">${esc(m.item)}</h2>
    <div class="sh-sub">${m.desc ? esc(m.desc) + ' · ' : ''}${m.priceL ? `${esc(sz[0])} ${money(m.price)} / ${esc(sz[1])} ${money(m.priceL)}` : money(m.price)}</div>
    ${m.priceL ? `<div class="ogrp" data-g="__size"><div class="ogrp-h"><span>容量</span><span class="req must">必選</span></div><div class="chips">
      <button class="chip" data-size="${esc(sz[0])}">${esc(sz[0])} <small>${money(m.price)}</small></button><button class="chip" data-size="${esc(sz[1])}">${esc(sz[1])} <small>${money(m.priceL)}</small></button></div></div>` : ''}
    ${groups.map(gr => `<div class="ogrp" data-g="${esc(gr.name)}"><div class="ogrp-h"><span>${esc(gr.name)}</span><span class="req ${gr.required ? 'must' : ''}">${gr.required ? '必選' : gr.multi ? '可複選' : '選填'}</span></div>
      <div class="chips">${gr.items.map(i => `<button class="chip" data-opt="${esc(i.label)}">${esc(i.label)}${i.add ? ` <small>+${i.add}</small>` : ''}</button>`).join('')}</div></div>`).join('')}
    <div class="ogrp"><div class="ogrp-h"><label for="it-note">備註</label><span class="req">選填</span></div>
      <input class="field" id="it-note" maxlength="60" placeholder="${drink ? '例如：分開裝、吸管另外給' : '例如：雞腿去皮、醬汁另外裝'}" value="${esc(base ? base.note : '')}"></div>
    ${drink ? `<div class="tlabel" aria-hidden="true"><div class="tl-top"><span>${esc(g.shop)}</span><span>${esc(S.me)}</span></div><div class="tl-item" id="tl-item"></div><div class="tl-opts" id="tl-opts"></div><div class="tl-bot"><span class="bars"></span><b class="num" id="tl-price"></b></div></div>` : ''}
    <div class="sheet-foot">
      <div class="stepper big"><button data-q="-1" aria-label="少一份">${I.minus}</button><span class="n" id="it-q"></span><button data-q="1" aria-label="多一份">${I.plus}</button></div>
      <button class="btn" id="it-add"></button>
    </div>`;
  openSheet('item', html, {
    mount(root) {
      const paint = () => {
        $$('[data-size]', root).forEach(c => c.classList.toggle('on', c.dataset.size === st.size));
        $$('.ogrp[data-g]', root).forEach(gEl => { const set = st.sel[gEl.dataset.g]; if (set) $$('[data-opt]', gEl).forEach(c => c.classList.toggle('on', set.has(c.dataset.opt))); });
        $('#it-q', root).textContent = st.qty;
        $('#it-add', root).textContent = (base ? '更新 · ' : '加入 · ') + money(unit() * st.qty);
        if (drink) {
          $('#tl-item', root).textContent = m.item + (st.size ? ' ' + st.size : '');
          const o = opts(), el = $('#tl-opts', root);
          el.textContent = o.length ? o.join(' / ') : '還沒選甜度、冰塊'; el.classList.toggle('ph', !o.length);
          $('#tl-price', root).textContent = money(unit()) + (st.qty > 1 ? ' ×' + st.qty : '');
        }
      };
      paint();
      root.addEventListener('click', e => {
        const sz = e.target.closest('[data-size]');
        if (sz) { st.size = sz.dataset.size; return paint(); }
        const op = e.target.closest('[data-opt]');
        if (op) {
          const gr = groups.find(x => x.name === op.closest('.ogrp').dataset.g), set = st.sel[gr.name], v = op.dataset.opt;
          if (gr.multi) { set.has(v) ? set.delete(v) : set.add(v); }
          else if (set.has(v) && !gr.required) set.clear();
          else { set.clear(); set.add(v); }
          return paint();
        }
        const q = e.target.closest('[data-q]');
        if (q) { st.qty = Math.min(20, Math.max(1, st.qty + +q.dataset.q)); return paint(); }
        if (e.target.closest('#it-add')) {
          const miss = groups.filter(gr => gr.required && !st.sel[gr.name].size);
          if (miss.length) {
            miss.forEach(gr => { const el = $(`.ogrp[data-g="${CSS.escape(gr.name)}"]`, root); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); });
            $(`.ogrp[data-g="${CSS.escape(miss[0].name)}"]`, root).scrollIntoView({ block: 'center', behavior: 'smooth' });
            return toast('還沒選' + miss.map(x => x.name).join('、'));
          }
          const line = { item: m.item, size: m.priceL ? st.size : '', opts: opts(), unit: unit(), qty: st.qty, note: $('#it-note', root).value.trim() };
          const lines = myLines(gid);
          if (base) lines.splice(editIdx, 1);
          const same = lines.find(l => lineKey(l) === lineKey(line));
          if (same) same.qty += line.qty; else if (base) lines.splice(editIdx, 0, line); else lines.push(line);
          if (base) { setMine(gid, lines); openCart(); toast('已更新'); }
          else { closeSheet(); setMine(gid, lines); toast('已加入 ' + m.item); }
        }
      });
    },
  });
}

function markBad(sel, msg) {

async function saveShop() {
  const E = S.edit, name = E.shop.name.trim();
  if (!name) return markBad('#ed-name', '請填店名');
  if (S.data.shops.some(s => s.name === name && s.name !== E.orig)) return markBad('#ed-name', '已經有「' + name + '」了');
  const items = [], seen = new Set(), drink = E.shop.type === '飲料';
  for (let ci = 0; ci < E.cats.length; ci++) {
    const c = E.cats[ci], s0 = c.sizes[0].trim(), s1 = c.sizes[1].trim();
    if (drink && c.items.some(i => i.item.trim() && i.priceL)) {
      if (!s0 || !s1) return markBad(`[data-f="${s0 ? 'sz1' : 'sz0'}"][data-ci="${ci}"]`, '「' + (c.name || '這個分類') + '」的容量名稱沒填');
      if (s0 === s1) return markBad(`[data-f="sz1"][data-ci="${ci}"]`, '兩種容量的名稱不能一樣');
    }
    for (let ii = 0; ii < c.items.length; ii++) {
      const it = c.items[ii], nm = it.item.trim(), row = `.erow[data-ci="${ci}"][data-ii="${ii}"]`;
      if (!nm && !it.price && !it.desc.trim()) continue;
      if (!nm) return markBad(row + ' [data-f="item"]', '有品項沒填名字');
      if (it.price === '') return markBad(row + ' [data-f="price"]', '「' + nm + '」沒填價格');
      if (seen.has(nm)) return markBad(row + ' [data-f="item"]', '「' + nm + '」重複了');
      seen.add(nm);
      items.push({ cat: c.name.trim() || '其他', item: nm, price: +it.price, priceL: +it.priceL || 0, desc: it.desc.trim(), sizes: s0 + '/' + s1 });
    }
  }
  if (!items.length) return toast('菜單至少要有一個品項');
  E.saving = true; renderBar();
  try {
    await api('saveShop', { pin: PIN, orig: E.orig, shop: Object.assign({}, E.shop, { name }), items });
    E.dirty = false; E.orig = name; toast('已儲存「' + name + '」');
    await refresh(); renderTop();
  } catch (err) { toast(err.message || '沒有存到，再試一次'); }
  E.saving = false; renderBar();
}

// 「# 分類 L/瓶」：分類後面可以接兩種容量的名稱
function parseMenu(text, drink) {
  let cat = '主餐', sizes = null; const out = [];
  String(text || '').split(/\r?\n/).forEach(raw => {
    const l = raw.trim(); if (!l) return;
    if (/^[#＃]/.test(l)) {
      let h = l.replace(/^[#＃]\s*/, '').replace(/[（(].*$/, '').trim();
      const sm = h.match(/^(.*?)\s+(\S{1,4})\s*[\/／]\s*(\S{1,4})$/);
      sizes = null;
      if (sm) { h = sm[1].trim(); sizes = [sm[2], sm[3]]; }
      cat = h || cat; return;
    }
    const m = l.match(/^(.+?)\s+\$?(\d+)(?:\s+\$?(\d+)(?=\s|$))?(?:\s+(.*))?$/);
    if (!m) return;
    let priceL = m[3] ? +m[3] : 0, desc = (m[4] || '').trim();
    if (!drink && m[3]) { desc = (m[3] + ' ' + desc).trim(); priceL = 0; }
    out.push({ cat, sizes, item: m[1].trim(), price: +m[2], priceL, desc });
  });
  return out;
}

    <div class="hint">一行一個品項：${drink ? '「品名 價格 第二種容量價格 說明」，只有一種容量就寫一個價格' : '「品名 價格 說明」'}，說明可以不寫。「#」開頭的行是分類${drink ? '，分類後面可以寫容量名稱，例如「# 純茶 L/瓶」，沒寫就是 M/L' : ''}。<b id="im-n"></b></div>

      ok.addEventListener('click', () => {

        });
        E.dirty = true; closeSheet(); renderMain(); renderBar(); toast('加入了 ' + items.length + ' 個品項，記得按儲存');
      });
    },
  });
}

    <div class="hint" style="margin-top:0">名單會出現在「你是哪位？」讓大家直接點選，也用來列出還沒點餐的人。</div>
    <div style="display:flex;gap:8px;margin-top:12px"><input class="field" id="mem-in" maxlength="200" placeholder="輸入名字，多個用空格隔開"><button class="btn auto" data-act="mem-add">加入</button></div>
    <div class="chips" style="margin-top:14px">${M.list.map((n, i) => `<span class="chip mem">${esc(n)}<button class="mini-x" data-act="mem-del" data-i="${i}" aria-label="移除 ${esc(n)}">${I.x}</button></span>`).join('') || '<span class="muted">名單是空的</span>'}</div>
    <div class="hint num">共 ${M.list.length} 人</div>
  </div>`;
}
async function saveMembers() {
  const M = S.mem; M.saving = true; renderBar();
  try { await api('saveMembers', { pin: PIN, members: M.list }); toast('已儲存名單'); await refresh(); S.mem = null; renderMain(); }
  catch (err) { toast(err.message || '沒有存到，再試一次'); M.saving = false; }
  renderBar();
}

// 編輯器的結構操作：改完重畫並標記有修改
function edChange(fn) { fn(); const o = S.view === 'shop' ? S.edit : S.adminTab === 'options' ? S.opt : S.mem; o.dirty = true; renderMain(); renderBar(); }
const swap = (a, i, j) => { if (j < 0 || j >= a.length) return; const t = a[i]; a[i] = a[j]; a[j] = t; };
const rowOf = el => { const r = el.closest('[data-ii]'); return { ci: +r.dataset.ci, gi: +r.dataset.gi, ii: +r.dataset.ii }; };
function focusLater(sel) { requestAnimationFrame(() => { const el = $(sel); if (el) { el.focus(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }); }

const ADMIN_ACT = {
  atab: async el => {
    const k = el.dataset.tab; if (k === S.adminTab) return;
    if (isDirty() && !(await askDiscard())) return;
    clearDirty(); S.adminTab = k; render(); window.scrollTo(0, 0);
  },
  pick: el => $$('.chip', el.parentElement).forEach(c => c.classList.toggle('on', c === el)),
  'do-open': async el => {
    const shop = $('#ad-shops .on').dataset.shop;
    const d = new Date(); d.setHours(+$('#ad-h').value, +$('#ad-m').value, 0, 0);
    if (d.getTime() <= now()) return toast('這個時間已經過了，請選晚一點');
    el.disabled = true;
    try {
      const r = await api('openGroup', { pin: PIN, shop, deadline: d.getTime(), note: $('#ad-note').value.trim() });
      toast('開團了：' + shop); await refresh();
      location.hash = r.id ? 'g-' + r.id : '';
    } catch (err) { toast(err.message || '沒有成功，再試一次'); el.disabled = false; }
  },
  'grp-op': async el => {
    const op = el.dataset.op, map = { close: ['closeGroup', {}], extend: ['extendGroup', { minutes: 15 }], reopen: ['extendGroup', { minutes: 30 }] }[op];
    el.disabled = true;
    try { await api(map[0], Object.assign({ pin: PIN, groupId: el.dataset.id }, map[1])); toast(op === 'close' ? '已結單' : '已延長'); S.sig = ''; await refresh(); }
    catch (err) { toast(err.message || '沒有成功，再試一次'); el.disabled = false; }
  },
  'grp-del': async el => {
    const g = S.data.groups.find(x => x.id === el.dataset.id); if (!g) return;
    const n = ordersOf(g.id).length;
    const ok = await confirmSheet('刪除這一團', `「${g.shop}」${fmtDate(g.deadline)} ${fmtTime(g.deadline)} 截止的團${n ? `，連同 ${n} 個人的訂單` : ''}會一起刪除，刪了就找不回來。`, '刪除', true);
    if (!ok) return;
    try { await api('deleteGroup', { pin: PIN, groupId: g.id }); toast('已刪除「' + g.shop + '」這一團'); S.sig = ''; await refresh(); }
    catch (err) { toast(err.message || '沒有成功，再試一次'); }
  },
  'edit-shop': el => startEdit(el.dataset.name),
  'to-admin': () => { location.hash = 'admin'; },
  'save-edit': () => (S.view === 'shop' ? saveShop() : S.adminTab === 'options' ? saveOptions() : saveMembers()),
  'ed-type': el => edChange(() => { S.edit.shop.type = el.dataset.v; }),
  'ed-disable': () => edChange(() => { S.edit.shop.disabled = !S.edit.shop.disabled; }),
  'ed-import': () => openImport(),
  'ec-up': el => edChange(() => swap(S.edit.cats, +el.dataset.ci, +el.dataset.ci - 1)),
  'ec-down': el => edChange(() => swap(S.edit.cats, +el.dataset.ci, +el.dataset.ci + 1)),
  'ec-del': async el => {
    const c = S.edit.cats[+el.dataset.ci], n = c.items.filter(i => i.item.trim()).length;
    if (n && !(await confirmSheet('刪除分類', '「' + (c.name || '未命名') + '」裡的 ' + n + ' 個品項會一起刪除（按儲存後才生效）。', '刪除', true))) return;
    edChange(() => S.edit.cats.splice(+el.dataset.ci, 1));
  },
  'ec-add': () => { edChange(() => S.edit.cats.push({ name: '', sizes: ['M', 'L'], items: [blankItem()] })); focusLater(`[data-f="cat"][data-ci="${S.edit.cats.length - 1}"]`); },
  'ei-add': el => {
    const ci = +el.dataset.ci; edChange(() => S.edit.cats[ci].items.push(blankItem()));
    focusLater(`.erow[data-ci="${ci}"][data-ii="${S.edit.cats[ci].items.length - 1}"] [data-f="item"]`);
  },
  'ei-up': el => { const r = rowOf(el); edChange(() => swap(S.edit.cats[r.ci].items, r.ii, r.ii - 1)); },
  'ei-down': el => { const r = rowOf(el); edChange(() => swap(S.edit.cats[r.ci].items, r.ii, r.ii + 1)); },
  'ei-del': el => { const r = rowOf(el); edChange(() => S.edit.cats[r.ci].items.splice(r.ii, 1)); },
  'ed-delshop': async () => {
    const name = S.edit.orig;
    if (!(await confirmSheet('刪除「' + name + '」', '店家和整份菜單都會刪除，已經點過的訂單紀錄會保留。', '刪除', true))) return;
    try { await api('deleteShop', { pin: PIN, name }); S.edit.dirty = false; toast('已刪除 ' + name); await refresh(); location.hash = 'admin'; }
    catch (err) { toast(err.message || '沒有成功，再試一次'); }
  },
  'opt-type': async el => {
    const v = el.dataset.v; if (v === S.opt.type) return;
    if (S.opt.dirty && !(await askDiscard())) return;
    loadOpt(v); renderMain(); renderBar();
  },
  'opt-own': () => {
    const shop = S.data.shops.find(s => s.name === S.opt.type); if (!shop) return;
    S.opt.groups = cloneGroups(groupOpts(shop.type)); S.opt.own = true; S.opt.dirty = true;
    renderMain(); renderBar(); toast('已複製共用選項，改好後按儲存');
  },
  'opt-revert': async () => {
    const key = S.opt.type;
    if (!(await confirmSheet('改回共用選項', '「' + key + '」的專屬選項會刪除，之後點餐改用共用的那一套。', '改回共用', true))) return;
    try { await api('saveOptions', { pin: PIN, type: key, groups: [] }); toast('已改回共用選項'); await refresh(); loadOpt(key); renderMain(); renderBar(); }
    catch (err) { toast(err.message || '沒有成功，再試一次'); }
  },
  'og-up': el => edChange(() => swap(S.opt.groups, +el.dataset.gi, +el.dataset.gi - 1)),
  'og-down': el => edChange(() => swap(S.opt.groups, +el.dataset.gi, +el.dataset.gi + 1)),
  'og-del': async el => {
    const g = S.opt.groups[+el.dataset.gi];
    if (!(await confirmSheet('刪除選項組', '「' + (g.name || '未命名') + '」和裡面的選項會一起刪除（按儲存後才生效）。', '刪除', true))) return;
    edChange(() => S.opt.groups.splice(+el.dataset.gi, 1));
  },
  'og-multi': el => edChange(() => { S.opt.groups[+el.dataset.gi].multi = el.dataset.v === '1'; }),
  'og-req': el => edChange(() => { const g = S.opt.groups[+el.dataset.gi]; g.required = !g.required; }),
  'og-add': () => { edChange(() => S.opt.groups.push({ name: '', multi: false, required: false, items: [{ label: '', add: '' }] })); focusLater(`[data-f="gname"][data-gi="${S.opt.groups.length - 1}"]`); },
  'oi-add': el => {
    const gi = +el.dataset.gi; edChange(() => S.opt.groups[gi].items.push({ label: '', add: '' }));
    focusLater(`.orow[data-gi="${gi}"][data-ii="${S.opt.groups[gi].items.length - 1}"] [data-f="label"]`);
  },
  'oi-del': el => { const r = rowOf(el); edChange(() => S.opt.groups[r.gi].items.splice(r.ii, 1)); },
  'mem-add': () => {
    const inp = $('#mem-in'), names = inp.value.split(/[\s,，、]+/).map(s => s.trim()).filter(Boolean);
    if (!names.length) return;
    const add = names.filter(n => !S.mem.list.includes(n));
    edChange(() => { S.mem.list.push(...add); });
    toast(add.length ? '加入 ' + add.length + ' 人，記得按儲存' : '名單上已經有了');
    focusLater('#mem-in');
  },
  'mem-del': el => edChange(() => S.mem.list.splice(+el.dataset.i, 1)),
};

// 編輯器的文字欄位：直接改狀態，不重畫（打字不會卡）
document.addEventListener('input', e => {
  const t = e.target, f = t.dataset && t.dataset.f; if (!f) return;
  (t.closest('.money-in') || t).classList.remove('bad');
  if (f === 'price' || f === 'priceL' || f === 'add') { const v = t.value.replace(/\D/g, '').slice(0, 5); if (v !== t.value) t.value = v; }
  let o = null;
  if (S.view === 'shop' && S.edit) {
    o = S.edit;
    if (f === 'name' || f === 'phone' || f === 'note') o.shop[f] = t.value;
    else if (f === 'cat') o.cats[+t.dataset.ci].name = t.value;
    else if (f === 'sz0' || f === 'sz1') {
      const ci = +t.dataset.ci, k = f === 'sz0' ? 0 : 1;
      o.cats[ci].sizes[k] = t.value.replace(/\//g, '');
      $$(`.erow[data-ci="${ci}"] .lab${k}`).forEach(s => { s.textContent = o.cats[ci].sizes[k]; });
    }
    else { const r = rowOf(t); o.cats[r.ci].items[r.ii][f] = t.value; }
  } else if (S.view === 'admin' && S.adminTab === 'options' && S.opt) {
    o = S.opt;
    if (f === 'gname') o.groups[+t.dataset.gi].name = t.value;
    else { const r = rowOf(t); o.groups[r.gi].items[r.ii][f] = t.value; }
  }
  if (o && !o.dirty) { o.dirty = true; renderBar(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'mem-in') { e.preventDefault(); ADMIN_ACT['mem-add'](); } });
window.addEventListener('beforeunload', e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });

/* ================= 互動 ================= */
let toastT;
function toast(msg) {
  const t = $('#toast'); t.innerHTML = esc(msg); t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800);
}
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); toast('已複製，貼給店家就好'); }
  catch (e) {
    openSheet('copy', `<h2 class="sh-h">複製給店家</h2><div class="sh-sub">長按下面的文字全選後複製</div><textarea class="field" id="cp-t" style="margin-top:12px;min-height:240px" readonly>${esc(txt)}</textarea>`,
      { mount(root) { const ta = $('#cp-t', root); ta.focus(); ta.select(); } });
  }
}
const ACT = {
  'open-group': el => { location.hash = 'g-' + el.dataset.id; },
  back: () => { if (location.hash) location.hash = ''; else route(); },
  tab: el => { S.tab = el.dataset.tab; renderTop(); renderMain(); window.scrollTo(0, 0); },
  cat: el => { const s = $('#cat-' + el.dataset.i); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  item: el => openItem(S.gid, el.dataset.item),
  quick: el => {
    if (!S.me) return askName(() => ACT.quick(el));
    const g = curGroup(), m = g && menuOf(g.shop).find(x => x.item === el.dataset.item); if (!m || !isOpen(g)) return;
    const lines = myLines(g.id), same = lines.find(l => l.item === m.item && !l.size && !l.opts.length && !l.note);
    if (same) same.qty++; else lines.push({ item: m.item, size: '', opts: [], unit: m.price, qty: 1, note: '' });
    setMine(g.id, lines); toast('已加入 ' + m.item);
    try { navigator.vibrate && navigator.vibrate(8); } catch (e) { }
  },
  inc: el => { const g = curGroup(), lines = myLines(g.id), l = lines[+el.dataset.idx]; if (l && isOpen(g)) { l.qty = Math.min(50, l.qty + 1); setMine(g.id, lines); } },
  dec: el => { const g = curGroup(), lines = myLines(g.id), l = lines[+el.dataset.idx]; if (l && isOpen(g)) { l.qty--; setMine(g.id, lines); } },
  'edit-line': el => { const g = curGroup(), l = myLines(g.id)[+el.dataset.idx]; if (l) openItem(g.id, l.item, +el.dataset.idx); },
  cart: () => openCart(),
  follow: el => {
    if (!S.me) return askName(() => ACT.follow(el));
    const g = curGroup(), o = ordersOf(g.id).find(x => x.name === el.dataset.name), src = o && o.lines[+el.dataset.idx];
    if (!src || !isOpen(g)) return;
    const line = Object.assign({}, src, { opts: src.opts.slice(), qty: 1, note: '' });
    const lines = myLines(g.id), same = lines.find(l => lineKey(l) === lineKey(line));
    if (same) same.qty++; else lines.push(line);
    setMine(g.id, lines); toast('跟點了 ' + [line.item, variantText(line)].filter(Boolean).join(' '));
  },
  me: () => askName(),
  admin: async () => { if (await needPin()) { closeSheet(); S.adminTab = 'open'; location.hash = 'admin'; } },
  collect: async () => {
    if (S.collecting) { S.collecting = false; return renderMain(); }
    if (await needPin()) { closeSheet(); S.collecting = true; renderMain(); toast('收款模式：點右邊開關標記已付'); }
  },
  filter: el => { S.unpaidOnly = el.dataset.v === '1'; renderMain(); },
  paid: async el => {
    const g = curGroup(), o = ordersOf(g.id).find(x => x.name === el.dataset.name); if (!o) return;
    const before = o.paid, paid = payState(o).k !== 'paid';
    o.paid = paid ? o.total : 0; S.sig = ''; renderMain();
    try { await api('setPaid', { pin: PIN, groupId: g.id, name: o.name, paid }); }
    catch (e) { o.paid = before; renderMain(); toast('沒有存到：' + (e.message || '連線失敗')); }
  },
  copy: () => copyText(storeText(curGroup())),
  'sheet-close': () => closeSheet(),
  reload: () => { S.loadErr = null; render(); refresh(); },
  'reset-demo': () => { Mock.reset(); S.sig = ''; S.pending = {}; refresh(); toast('範例資料已重設'); },
};
Object.assign(ACT, ADMIN_ACT);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
$('#scrim').addEventListener('click', () => closeSheet());
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

// 面板往下拉關閉
(() => {
  const sh = $('#sheet'); let y0 = null, dy = 0;
  $('#grab').addEventListener('touchstart', e => { if (S.sheetLocked) return; y0 = e.touches[0].clientY; dy = 0; sh.classList.add('drag'); }, { passive: true });
  window.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
  window.addEventListener('touchend', () => { if (y0 == null) return; y0 = null; sh.classList.remove('drag'); sh.style.transform = ''; if (dy > 90) closeSheet(); });
})();

const curHash = () => S.view === 'group' ? 'g-' + S.gid : S.view === 'admin' || S.view === 'shop' ? S.view : '';
function route() {
  if (S.guardSkip) { S.guardSkip = false; return; }
  const h = location.hash.slice(1), was = curHash();
  // 編輯到一半要離開：先把網址改回來，問過再走
  if (h !== was && isDirty()) {
    S.guardSkip = true; location.hash = was;
    askDiscard().then(ok => { if (ok) { clearDirty(); location.hash = h; } });
    return;
  }
  if ((h === 'admin' || h === 'shop') && !S.pinOk) { location.hash = ''; return; }
  if (h === 'shop' && !S.edit) { location.hash = 'admin'; return; }
  if (h.indexOf('g-') === 0) { S.view = 'group'; S.gid = h.slice(2); }
  else if (h === 'admin' || h === 'shop') { S.view = h; S.gid = null; }
  else { S.view = 'home'; S.gid = null; }
  if (S.view !== 'shop') S.edit = null;
  if (was !== h) { S.tab = 'menu'; S.collecting = false; S.unpaidOnly = false; if (S.sheet && !S.sheetLocked) closeSheet(); }
  render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

// 捲動：表頭陰影＋分類高亮
let spyRaf = 0;
function spy() {
  const top = $('#top'); top.classList.toggle('raised', window.scrollY > 4);
  const cats = $('#cats'); if (!cats) return;
  const lim = top.offsetHeight + 24;
  let act = 0; $$('.sec').forEach((s, i) => { if (s.getBoundingClientRect().top <= lim) act = i; });
  const btns = $$('.cat', cats);
  if (btns[act] && !btns[act].classList.contains('on')) {
    btns.forEach((b, i) => b.classList.toggle('on', i === act));
    const b = btns[act]; cats.scrollTo({ left: b.offsetLeft - 16, behavior: 'smooth' });
  }
}
window.addEventListener('scroll', () => { if (!spyRaf) spyRaf = requestAnimationFrame(() => { spyRaf = 0; spy(); }); }, { passive: true });
window.addEventListener('resize', setHdr);

// 倒數計時
let lastOpen = '';
setInterval(() => {
  $$('[data-cd]').forEach(el => {
    const g = { deadline: +el.dataset.cd, status: el.dataset.st };
    const txt = g.status === 'closed' ? '已結單' : cdText(g.deadline);
    if (el.textContent !== txt) el.textContent = txt;
    const cls = 'cd ' + cdClass(g); if (el.className !== cls) el.className = cls;
  });
  const openIds = S.data.groups.filter(isOpen).map(g => g.id).join();
  if (S.loaded && openIds !== lastOpen) { if (lastOpen) softRender(); lastOpen = openIds; }
}, 1000);

setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, CONFIG.POLL_MS);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); else flushAll(); });
window.addEventListener('pagehide', flushAll);

(function init() {
  const cached = store.get(CACHE_KEY, null);
  route();
  if (cached) applyData(cached, true);
  refresh();
})();
</script>
</body>
</html>
